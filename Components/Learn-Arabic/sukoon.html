<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Su-koon — Arabic Letters</title>
<link rel="stylesheet" href="../../style.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&family=Noto+Naskh+Arabic:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
    :root {
        --ink: #121212;
        --muted: #858585;
        --blue: #eaf0ff;
        --symbol: #252b78;
    }

    .fat-hah-header {
        display: flex;
        align-items: center;
        gap: 14px;
        padding: 18px 20px 8px;
    }

    .fat-hah-header h1 {
        margin: 0;
        color: #5c4b37;
        font-size: 18px;
    }

    .fat-hah-intro {
        margin: 18px 20px 14px;
        color: var(--muted);
        font-size: 14px;
    }

    .letter-list {
        display: flex;
        flex-direction: column;
        gap: 12px;
        padding: 0 20px 20px;
    }

    .letter-row {
        appearance: none;
        width: 100%;
        min-height: 76px;
        display: flex;
        align-items: center;
        gap: 14px;
        padding: 12px 14px;
        border: 1px solid rgba(225, 229, 239, 0.85);
        border-radius: 16px;
        background: #fff;
        box-shadow: 0 10px 24px rgba(39, 47, 83, 0.12);
        color: var(--ink);
        font-family: 'Outfit', sans-serif;
        text-align: left;
        cursor: pointer;
        transition: transform 0.18s ease, box-shadow 0.18s ease;
    }

    .letter-row:hover,
    .letter-row:focus-visible {
        transform: translateY(-2px);
        box-shadow: 0 14px 28px rgba(39, 47, 83, 0.16);
        outline: none;
    }

    .letter-glyph {
        flex: 0 0 52px;
        width: 52px;
        height: 52px;
        display: flex;
        align-items: center;
        justify-content: center;
        border-radius: 12px;
        background: var(--blue);
        color: var(--symbol);
        font-family: 'Noto Naskh Arabic', serif;
        font-size: 26px;
        line-height: 1;
    }

    .letter-info {
        flex: 1;
        min-width: 0;
    }

    .letter-info h2 {
        margin: 0;
        font-size: 15px;
        line-height: 1.2;
    }

    .letter-info p {
        margin: 2px 0 0;
        color: var(--muted);
        font-size: 12px;
        line-height: 1.35;
    }

    .letter-arrow {
        flex: 0 0 auto;
        color: #c0c5d2;
    }

    @media (max-width: 480px) {
        .letter-list {
            padding: 0 16px 24px;
        }
    }
</style>
</head>
<body>
<div class="app-container">
    <header class="fat-hah-header">
        <button class="icon-btn" id="btn-back" type="button" title="Go Back" aria-label="Go back">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#8E785C" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <line x1="19" y1="12" x2="5" y2="12"></line>
                <polyline points="12 19 5 12 12 5"></polyline>
            </svg>
        </button>
        <h1>Su-koon</h1>
    </header>

    <p class="fat-hah-intro">Choose a letter to recognize and write with Sukoon</p>

    <main class="letter-list" id="letter-list" aria-label="28 Arabic letters with Sukoon"></main>
</div>

<script>
    const sukoonMark = '\u0652';
    const letters = [
        ['أ', 'Alif'], ['ب', 'Ba'], ['ت', 'Ta'], ['ث', 'Tha'],
        ['ج', 'Jeem'], ['ح', 'Haa'], ['خ', 'Khaa'], ['د', 'Dal'],
        ['ذ', 'Thal'], ['ر', 'Ra'], ['ز', 'Zay'], ['س', 'Seen'],
        ['ش', 'Sheen'], ['ص', 'Saad'], ['ض', 'Dad'], ['ط', 'Taa'],
        ['ظ', 'Dhaa'], ['ع', 'Ain'], ['غ', 'Ghain'], ['ف', 'Fa'],
        ['ق', 'Qaf'], ['ك', 'Kaf'], ['ل', 'Lam'], ['م', 'Meem'],
        ['ن', 'Nun'], ['هـ', 'Ha'], ['و', 'Waw'], ['ي', 'Ya']
    ];

    document.getElementById('btn-back').addEventListener('click', () => {
        window.location.href = 'level2.html';
    });

    const letterList = document.getElementById('letter-list');

    letters.forEach(([char, name], index) => {
        const row = document.createElement('button');
        row.type = 'button';
        row.className = 'letter-row';
        row.innerHTML = `
            <span class="letter-glyph" lang="ar" dir="rtl">${char}${sukoonMark}</span>
            <span class="letter-info">
                <h2>${name}</h2>
                <p>Learn to recognize and write</p>
            </span>
            <svg class="letter-arrow" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <polyline points="9 18 15 12 9 6"></polyline>
            </svg>
        `;
        row.addEventListener('click', () => {
            window.location.href = `tracing-sukoon.html?letter=${index}`;
        });
        letterList.appendChild(row);
    });
</script>
</body>
</html>
