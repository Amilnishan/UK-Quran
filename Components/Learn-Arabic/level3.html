<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, user-scalable=no">
<title>Learn Arabic — Level 3 Connected Letters</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Naskh+Arabic:wght@400;500;600;700&family=Outfit:wght@500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{--ink:#1f2937;--muted:#6b7280;--blue:#174f82;--red:#e53935}*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:#f4f5f8;color:var(--ink)}body{font-family:'Outfit',Arial,sans-serif}button{font:inherit}.page{width:min(960px,100%);margin:auto;padding:0 20px 36px}.topbar{margin:0 -20px 24px;padding:20px 84px;background:linear-gradient(135deg,#174f82,#236b9e);color:#fff;text-align:center;position:relative;box-shadow:0 8px 24px rgba(20,48,92,.16)}.topbar h1{margin:0;font-size:27px;font-weight:800}.progress{margin:4px 0 0;font-size:15px;font-weight:600}.back-btn{position:absolute;left:22px;top:18px;width:48px;height:48px;border:0;border-radius:50%;background:#fff;color:var(--blue);display:grid;place-items:center;cursor:pointer;box-shadow:0 5px 16px rgba(0,0,0,.12)}.back-btn svg{width:27px;height:27px}.lesson-card{background:#fff;border-radius:20px;padding:26px;box-shadow:0 10px 28px rgba(20,48,92,.13)}.lesson-heading{text-align:center;margin:0 0 22px}.letter{font-family:'Noto Naskh Arabic',serif;font-size:70px;line-height:1;color:#174f82;direction:rtl}.lesson-heading h2{margin:8px 0 4px;font-size:25px}.lesson-heading p{margin:0;color:var(--muted);font-size:14px}.positions{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}.position{border:2px solid #183b5d;border-radius:16px;overflow:hidden;min-width:0}.position h3{margin:0;padding:12px;text-align:center;font-size:18px}.initial h3{background:#dff5e7}.medial h3{background:#e4f1ff}.final h3{background:#ffe3e1}.position h3 small{font-size:14px;font-weight:500}.word-box{min-height:142px;display:grid;place-items:center;padding:18px 12px;direction:rtl}.word{font-family:'Noto Naskh Arabic',serif;font-size:48px;line-height:1.45;color:#173c5d;white-space:nowrap}.target{color:var(--red);font-weight:700}.position p{margin:0;padding:0 12px 14px;text-align:center;color:var(--muted);font-size:12px;line-height:1.45}.note{margin:20px 0 0;padding:13px 16px;border-radius:14px;background:#f7f9fc;text-align:center;color:#667085;font-size:13px;line-height:1.6}.controls{display:flex;justify-content:center;gap:12px;margin-top:22px}.controls button{border:0;border-radius:999px;padding:11px 22px;background:#eaf3ff;color:#1e5d98;font-weight:700;cursor:pointer}.controls .next{background:#2d78b6;color:#fff}.controls button:disabled{opacity:.4;cursor:not-allowed}.final{order:1}.medial{order:2}.initial{order:3}@media(max-width:700px){.page{padding:0 12px 28px}.topbar{margin:0 -12px 18px;padding:18px 64px}.topbar h1{font-size:22px}.back-btn{left:16px;top:15px}.lesson-card{padding:16px;border-radius:18px}.positions{grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}.position h3{padding:8px 3px;font-size:13px;line-height:1.2}.position h3 small{font-size:10px}.word-box{min-height:104px;padding:10px 2px}.word{font-size:34px}.position p{padding:0 4px 10px;font-size:10px;line-height:1.3}.letter{font-size:60px}}
</style>
</head>
<body>
<div class="page">
  <header class="topbar"><button class="back-btn" id="back-btn" type="button" aria-label="Back to Learn Arabic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M19 12H5"></path><path d="M12 19l-7-7 7-7"></path></svg></button><h1>Level 3: Connected Letters</h1><p class="progress" id="counter">1 / 28</p></header>
  <main class="lesson-card"><section class="lesson-heading"><div class="letter" id="letter-glyph"></div><h2 id="letter-name"></h2><p>See this letter at the beginning, middle, and end of a word.</p></section><section class="positions" id="positions"></section><p class="note">The red letter is the letter you selected. Some Arabic letters do not connect to the letter after them, so their normal shape remains visible.</p><nav class="controls" aria-label="Lesson navigation"><button type="button" id="previous">Previous</button><button type="button" class="next" id="next">Next</button></nav></main>
</div>
<script src="level3-data.js"></script>
<script>
(() => {
  'use strict';
  const letters = window.Level3Letters, counter = document.getElementById('counter'), glyph = document.getElementById('letter-glyph'), name = document.getElementById('letter-name'), positions = document.getElementById('positions'), previous = document.getElementById('previous'), next = document.getElementById('next');
  const labels = [['initial','INITIAL','Start','The letter appears at the beginning of the word.'],['medial','MEDIAL','Middle','The letter appears in the middle of the word.'],['final','FINAL','End','The letter appears at the end of the word.']];
  const requested = Number.parseInt(new URLSearchParams(location.search).get('letter'), 10); let index = Number.isInteger(requested) && requested >= 0 && requested < letters.length ? requested : 0;
  function markTarget(word, target, occurrence = 0) { const chars = Array.from(word); let start = -1; for (let i = 0, found = 0; i < chars.length; i++) { if (chars[i] === target && found++ === occurrence) { start = i; break; } } if (start < 0) return word; let end = start + 1; while (end < chars.length && /[\u064B-\u065F\u0670\u06D6-\u06ED]/.test(chars[end])) end++; return chars.slice(0,start).join('') + '<span class="target">' + chars.slice(start,end).join('') + '</span>' + chars.slice(end).join(''); }
  function render() { const letter = letters[index]; counter.textContent = `${index + 1} / ${letters.length}`; glyph.textContent = letter.display; name.textContent = `${letter.name} — ${letter.ar}`; positions.innerHTML = labels.map(([className,title,subtitle,help], formIndex) => `<article class="position ${className}"><h3>${title} <small>(${subtitle})</small></h3><div class="word-box"><div class="word">${markTarget(letter.forms[formIndex],letter.ar,(letter.highlightOccurrences || [])[formIndex] || 0)}</div></div><p>${help}</p></article>`).join(''); previous.disabled = index === 0; next.disabled = index === letters.length - 1; const url = new URL(location.href); url.searchParams.set('letter',String(index)); history.replaceState(null,'',url); }
  previous.addEventListener('click', () => { if(index > 0) { index--; render(); } }); next.addEventListener('click', () => { if(index < letters.length - 1) { index++; render(); } }); document.getElementById('back-btn').addEventListener('click', () => { location.href = 'learn-arabic-without-harakat.html'; }); render();
})();
</script>
</body>
</html>
