<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, user-scalable=no">
<title>Level 3 Exam — Connected Letters</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Naskh+Arabic:wght@400;500;600;700&family=Outfit:wght@500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{--ink:#2a2b31;--muted:#6b6d78;--blue:#2f8fe0;--blue-deep:#1e6fc2;--green:#1fa35c;--red:#e9455a;--heart:#ff4d6d;--empty:#e7e3da}*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:linear-gradient(160deg,#fbfaf6,#f3f7fb);color:var(--ink)}body{font-family:'Outfit',Arial,sans-serif}button{font:inherit}#app{width:min(760px,100%);margin:auto;min-height:100vh;padding:0 18px 32px}.topbar{margin:0 -18px 18px;padding:18px 76px;background:linear-gradient(135deg,#174f82,#246b9f);color:#fff;text-align:center;position:relative;box-shadow:0 8px 24px rgba(20,48,92,.16)}.topbar h1{margin:0;font-size:28px;font-weight:800}.back-btn{position:absolute;left:18px;top:18px;width:48px;height:48px;border:0;border-radius:50%;background:#fff;color:#174f82;display:grid;place-items:center;cursor:pointer}.back-btn svg{width:27px;height:27px}#hud{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:0 0 14px}#lives{display:flex;gap:4px;direction:ltr}.heart{font-size:25px;line-height:1;color:var(--heart)}.heart.empty{color:var(--empty)}.pill{padding:8px 13px;border-radius:999px;background:#fff;box-shadow:0 5px 16px rgba(20,48,92,.10);font-weight:700;color:var(--blue-deep)}#score{direction:ltr;color:#3d4b5d}#timer{direction:ltr;color:#3d4b5d}#game-card{background:#fff;border-radius:24px;padding:20px;box-shadow:0 12px 30px rgba(20,48,92,.12);min-height:560px}.hidden{display:none!important}#start,#end{min-height:420px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center}#start h2,#end h2{margin:0 0 8px;font-size:26px}.note{max-width:470px;color:var(--muted);line-height:1.7;margin:0 0 22px}.arabic{font-family:'Noto Naskh Arabic',serif;direction:rtl}.arabic-example{white-space:nowrap}#question{text-align:center;margin:4px 0 12px}#question p{margin:0 0 8px;color:var(--muted);font-size:15px;font-weight:700}#prompt{min-height:56px;display:flex;justify-content:center;align-items:center;gap:9px;flex-wrap:wrap;font-size:34px;line-height:1.5}.prompt-part{display:inline-flex;align-items:center;gap:8px}.plus{font-family:'Outfit',sans-serif;color:#a2a8b2;font-size:19px;font-weight:800}#feedback{min-height:28px;text-align:center;font-weight:800;font-size:17px;margin-bottom:8px}.good{color:var(--green)}.bad{color:var(--red)}#board{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;min-height:285px;align-content:center}.option{border:2px solid #e1e8f0;background:#f9fbfd;border-radius:18px;min-height:88px;padding:10px;cursor:pointer;display:grid;place-items:center;transition:.14s ease;box-shadow:0 4px 12px rgba(20,48,92,.06)}.option:hover,.option:focus-visible{transform:translateY(-2px);border-color:#8cb9df;outline:none;box-shadow:0 8px 18px rgba(20,48,92,.12)}.option span{font-family:'Noto Naskh Arabic',serif;font-size:34px;color:#173c5d;line-height:1.45;white-space:nowrap;direction:rtl}.option.correct{border-color:var(--green);background:#eaf8ef}.option.wrong{border-color:var(--red);background:#fff0ef}.option:disabled{pointer-events:none}#play,#replay,#learn{border:0;border-radius:999px;cursor:pointer;padding:13px 26px;font-weight:800}#play,#replay{background:linear-gradient(135deg,#2f8fe0,#1e6fc2);color:#fff;box-shadow:0 9px 20px rgba(30,111,194,.25)}#learn{margin-top:10px;background:#edf5fc;color:var(--blue-deep)}#result-status{min-height:22px;margin:0 0 12px;color:var(--muted)}@media(max-width:560px){#app{padding:0 10px 24px}.topbar{margin:0 -10px 14px;padding:17px 62px}.topbar h1{font-size:22px}.back-btn{left:12px;top:15px;width:43px;height:43px}#game-card{padding:14px;border-radius:20px}#prompt{font-size:30px}.option span{font-size:30px}}@media(max-width:390px){#board{grid-template-columns:repeat(2,minmax(0,1fr))}.option span{font-size:28px}}
</style>
</head>
<body>
<div id="app">
  <header class="topbar"><button class="back-btn" id="back" type="button" aria-label="Back to Learn Arabic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M19 12H5"></path><path d="M12 19l-7-7 7-7"></path></svg></button><h1>Level 3: Connected Letters</h1></header>
  <div id="hud" class="hidden"><div id="lives" aria-live="polite"></div><div class="pill">Round <span id="round">1</span> / 4</div><div class="pill" id="timer" aria-label="Time remaining">Time: <span id="time-value">10</span></div><div class="pill" id="score">Score: <span id="score-value">0</span></div></div>
  <main id="game-card">
    <section id="start"><h2>Choose the connected word</h2><p class="note">First, see the letters separately, such as <strong class="arabic arabic-example" dir="rtl">أَ + كَ + لَ</strong>. Then choose the correctly connected Arabic word. You have 5 lives.</p><button id="play" type="button">START GAME</button></section>
    <section id="game" class="hidden"><div id="question"><p>Connect these letters</p><div class="arabic" id="prompt"></div></div><div id="feedback" aria-live="polite"></div><div id="board"></div></section>
    <section id="end" class="hidden"><h2 id="end-title">Game complete!</h2><p class="note">Your score: <strong id="final-score">0</strong> / <span id="max-score">280</span></p><p id="result-status" aria-live="polite"></p><button id="replay" type="button">Replay Game</button><button id="learn" type="button">Back to Learn Arabic</button></section>
  </main>
</div>
<script src="level3-data.js"></script>
<script type="module">
import { onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import { get, ref, update } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";
import { auth, database } from "../../JavaScript/firebase-config.js";

(() => {
  'use strict';
  const data = window.Level3Letters.map(({ ar: letter, gameWord: word }) => ({ letter, word }));
  const roundSizes = [3, 6, 9, 12], questionsPerRound = 7, maxLives = 5, points = 10, maxScore = data.length * points;
  const $ = id => document.getElementById(id), start = $('start'), game = $('game'), end = $('end'), hud = $('hud'), board = $('board'), prompt = $('prompt'), feedback = $('feedback'), lives = $('lives'), round = $('round'), scoreValue = $('score-value'), finalScore = $('final-score'), maxScoreEl = $('max-score'), resultStatus = $('result-status');
  let score = 0, livesLeft = maxLives, roundIndex = 0, questionIndex = 0, pool = [], target, locked = false, timeLeft = 10, timerId = null, transitionId = null, audioCtx = null;
  function ensureAudio(){ if(!audioCtx){ try{ audioCtx = new (window.AudioContext || window.webkitAudioContext)(); }catch(e){} } else if(audioCtx.state === 'suspended'){ audioCtx.resume(); } }
  function tone(freq, start, dur, type, gain){ if(!audioCtx) return; const osc = audioCtx.createOscillator(), g = audioCtx.createGain(); osc.type = type || 'sine'; osc.frequency.value = freq; g.gain.value = 0; osc.connect(g); g.connect(audioCtx.destination); const t0 = audioCtx.currentTime + start; g.gain.setValueAtTime(0, t0); g.gain.linearRampToValueAtTime(gain || 0.18, t0 + 0.02); g.gain.exponentialRampToValueAtTime(0.001, t0 + dur); osc.start(t0); osc.stop(t0 + dur + 0.02); }
  function playSuccess(){ tone(587, 0, .14, 'sine', .2); tone(880, .11, .22, 'sine', .2); }
  function playFail(){ tone(320, 0, .16, 'sawtooth', .12); tone(190, .1, .24, 'sawtooth', .12); }
  const shuffle = values => { const copy = values.slice(); for(let i=copy.length - 1;i>0;i--){ const j = Math.floor(Math.random() * (i + 1)); [copy[i],copy[j]] = [copy[j],copy[i]]; } return copy; };
  const splitArabic = word => Array.from(word).reduce((parts,char) => { if(parts.length && /[\u064B-\u065F\u0670\u06D6-\u06ED]/.test(char)) parts[parts.length-1] += char; else parts.push(char); return parts; }, []);
  function renderLives(){ lives.innerHTML = Array.from({length:maxLives},(_,i) => `<span class="heart${i >= livesLeft ? ' empty' : ''}" aria-hidden="true">${i < livesLeft ? '♥' : '♡'}</span>`).join(''); lives.setAttribute('aria-label',`${livesLeft} lives remaining`); }
  function clearQuestionTimers(){ if(timerId !== null){ clearInterval(timerId); timerId = null; } if(transitionId !== null){ clearTimeout(transitionId); transitionId = null; } }
  function renderTimer(){ $('time-value').textContent = String(timeLeft); }
  function startTimer(){ clearInterval(timerId); timeLeft = 10; renderTimer(); timerId = setInterval(() => { if(locked) return; timeLeft--; renderTimer(); if(timeLeft <= 0) resolveQuestion('timeout'); }, 1000); }
  function renderQuestion(){ prompt.innerHTML = splitArabic(target.word).map((part,index) => `<span class="prompt-part"><span>${part}</span>${index < splitArabic(target.word).length - 1 ? '<span class="plus">+</span>' : ''}</span>`).join(''); const options = shuffle([target,...shuffle(data.filter(item => item.word !== target.word)).slice(0,roundSizes[roundIndex]-1)]); board.innerHTML = ''; options.forEach(option => { const button = document.createElement('button'); button.type = 'button'; button.className = 'option'; button.innerHTML = `<span>${option.word}</span>`; button.addEventListener('click', () => select(button, option)); board.appendChild(button); }); startTimer(); }
  function beginRound(){ pool = shuffle(data).slice(roundIndex * questionsPerRound, (roundIndex + 1) * questionsPerRound); questionIndex = 0; round.textContent = String(roundIndex + 1); nextQuestion(); }
  function nextQuestion(){ clearQuestionTimers(); if(livesLeft <= 0) return finish(false); if(questionIndex >= pool.length){ if(roundIndex === roundSizes.length - 1) return finish(true); roundIndex++; return beginRound(); } target = pool[questionIndex]; locked = false; feedback.textContent = ''; feedback.className = ''; renderQuestion(); }
  function resolveQuestion(result, button){ if(locked) return; locked = true; clearInterval(timerId); timerId = null; board.querySelectorAll('button').forEach(btn => { btn.disabled = true; }); if(result === 'correct'){ score += points; scoreValue.textContent = String(score); if(button) button.classList.add('correct'); playSuccess(); feedback.textContent = 'Correct!'; feedback.className = 'good'; } else { livesLeft--; renderLives(); if(result === 'timeout'){ feedback.textContent = livesLeft ? "Time's up!" : 'No lives left.'; } else { if(button) button.classList.add('wrong'); playFail(); feedback.textContent = livesLeft ? 'Wrong answer.' : 'No lives left.'; } feedback.className = 'bad'; } questionIndex++; if(livesLeft <= 0){ transitionId = setTimeout(() => finish(false),650); } else { transitionId = setTimeout(nextQuestion,650); } }
  function select(button, option){ if(locked) return; resolveQuestion(option.word === target.word ? 'correct' : 'wrong', button); }
  function play(){ ensureAudio(); clearQuestionTimers(); score = 0; livesLeft = maxLives; roundIndex = 0; questionIndex = 0; timeLeft = 10; scoreValue.textContent = '0'; renderTimer(); renderLives(); start.classList.add('hidden'); end.classList.add('hidden'); game.classList.remove('hidden'); hud.classList.remove('hidden'); beginRound(); }
  const identity = {studentId:null,teacherUid:null,ready:false}; let resolveIdentity; const identityReady = new Promise(resolve => { resolveIdentity = resolve; });
  onAuthStateChanged(auth, async user => { try { if(user?.email?.endsWith('@student.ukquran.com')) { const studentId = user.email.split('@')[0].toLowerCase(), teachers = await get(ref(database,'teachers')); teachers.forEach(teacher => { if(!identity.teacherUid && teacher.child(`students/${studentId}`).exists()) { identity.studentId = studentId; identity.teacherUid = teacher.key; } }); } } catch(error) { console.error('Unable to resolve student identity:',error); } finally { identity.ready = true; resolveIdentity(); } });
  async function saveResult(){ if(sessionStorage.getItem('isGuest') === 'true') return; resultStatus.textContent = 'Saving result...'; try { await identityReady; if(!identity.teacherUid || !identity.studentId) throw new Error('Student identity is not available'); await update(ref(database,`teachers/${identity.teacherUid}/students/${identity.studentId}/gameResults`),{level3:score}); resultStatus.textContent = 'Result saved'; resultStatus.style.color = 'var(--green)'; } catch(error) { console.error('Unable to save Level 3 game result:',error); resultStatus.textContent = 'Result could not be saved. Please try again.'; resultStatus.style.color = 'var(--red)'; } }
  async function finish(won){ clearQuestionTimers(); locked = true; game.classList.add('hidden'); hud.classList.add('hidden'); finalScore.textContent = String(score); maxScoreEl.textContent = String(maxScore); $('end-title').textContent = won ? 'Excellent! You completed Level 3.' : 'Keep practising — you can try again.'; resultStatus.textContent = ''; end.classList.remove('hidden'); await saveResult(); }
  const back = () => { location.href = 'learn-arabic-without-harakat.html'; }; $('play').addEventListener('click',play); $('replay').addEventListener('click',play); $('learn').addEventListener('click',back); $('back').addEventListener('click',back); maxScoreEl.textContent = String(maxScore); renderLives();
})();
</script>
</body>
</html>
