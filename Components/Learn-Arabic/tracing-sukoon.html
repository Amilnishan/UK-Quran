<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

<title>تعلّم الحروف — Arabic Letter Tracer</title>

<link rel="preconnect" href="https://fonts.googleapis.com">

<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Noto+Naskh+Arabic:wght@400;500;600;700&display=swap" rel="stylesheet">

<style>


  :root{
    --blue:#003399;
    --blue-dark:#002266;
    --paper:#f4f6fb;
    --card:#ffffff;
    --ink:#1a1a2e;
    --muted:#7a80a0;
    --guide:#c7cde0;
    --good:#1fa15b;
    --bad:#d13b3b;
    --gold:#f2b705;
  }

  *{
    box-sizing:border-box;
    -webkit-tap-highlight-color:transparent;
  }

  html,body{height:100%;}

  body{
    margin:0;
    min-height:100%;
    background:linear-gradient(180deg,#e7ebf7 0%,var(--paper) 220px);
    font-family:"Segoe UI","Tahoma",-apple-system,BlinkMacSystemFont,sans-serif;
    display:flex;
    align-items:flex-start;
    justify-content:center;
    padding:18px 12px 40px;
    color:var(--ink);
  }

  .app{
    width:100%;
    max-width:400px;
  }

  .card{
    background:var(--card);
    border-radius:22px;
    overflow:hidden;
    box-shadow:0 12px 30px rgba(0,25,90,0.14);
  }

  header{
    position:relative;
    background:linear-gradient(160deg,var(--blue) 0%,var(--blue-dark) 100%);
    color:#fff;
    padding:16px 14px 20px;
    text-align:center;
  }

  .exit-row{
    position:relative;
    height:38px;
    display:flex;
    margin-bottom:10px;
  }

  .exit-row .exit-btn{
    position:absolute;
    top:0;
    left:0;
  }

  .exit-row .idx{
    position:absolute;
    top:10px;
    right:0;
  }

  .exit-btn{
    background:rgba(255,255,255,0.12);
  }

  .exit-row .idx{
    font-size:11px;
    letter-spacing:1px;
    color:#c9d3f5;
  }

  .nav-row{
    position:relative;
    min-height:90px;
    display:flex;
    gap:8px;
  }

  .nav-row .nav-btn{
    position:absolute;
    top:0;
  }

  .nav-row #backBtn{
    left:0;
  }

  .nav-row #nextBtn{
    right:0;
  }

  .nav-btn{
    width:38px;
    height:38px;
    border-radius:50%;
    border:none;
    background:rgba(255,255,255,0.16);
    color:#fff;
    font-size:18px;
    display:flex;
    align-items:center;
    justify-content:center;
    cursor:pointer;
    transition:transform .12s ease, background .15s ease;
    flex-shrink:0;
  }

  .nav-btn:active{
    transform:scale(0.9);
    background:rgba(255,255,255,0.32);
  }

  .letter-meta{
    flex:1;
  }

  .letter-meta .idx{
    font-size:11px;
    letter-spacing:1px;
    color:#c9d3f5;
    margin-bottom:2px;
  }

  .letter-meta .names{
    font-size:14px;
    color:#e6ebff;
  }

  .letter-meta .names b{
    color:#fff;
    font-weight:600;
  }

  .big-char{
    font-size:64px;
    line-height:1;
    margin:10px 0 2px;
    font-weight:400;
    font-family:"Noto Naskh Arabic","Segoe UI",serif;
  }

  .names,
  .names b{
    font-family:"Noto Naskh Arabic","Segoe UI",sans-serif;
  }

  .streak-wrap{
    margin-top:14px;
    display:flex;
    align-items:center;
    justify-content:center;
    gap:6px;
  }

  .streak-dot{
    width:11px;
    height:11px;
    border-radius:50%;
    background:rgba(255,255,255,0.25);
    transition:background .2s ease,transform .2s ease;
  }

  .streak-dot.filled{
    background:var(--gold);
    transform:scale(1.15);
  }

  .streak-label{
    font-size:11px;
    color:#c9d3f5;
    margin-top:8px;
    letter-spacing:.3px;
  }

  .mode-badge{
    display:inline-block;
    margin-top:8px;
    padding:4px 12px;
    border-radius:20px;
    font-size:11px;
    font-weight:600;
    letter-spacing:.4px;
  }

  .mode-badge.tracing{
    background:rgba(255,255,255,0.18);
    color:#fff;
  }

  .mode-badge.blank{
    background:var(--gold);
    color:#3a2900;
  }

  .body-area{
    padding:16px 16px 18px;
  }

  .instruction{
    text-align:center;
    font-size:13.5px;
    color:var(--muted);
    margin:0 0 12px;
    min-height:18px;
  }

  .canvas-wrap{
    position:relative;
    width:100%;
    border-radius:16px;
    background: #fbfcff;
    border:2px solid #e3e7f5;
    touch-action:none;
    overflow:hidden;
    transition:border-color .2s ease,box-shadow .2s ease,transform .2s ease;
  }

  .reference-char{
    position:absolute;
    top:50%;
    right:10px;
    transform:translateY(-50%);
    color:var(--muted);
    font-family:"Noto Naskh Arabic","Segoe UI",serif;
    font-size:94px;
    line-height:1;
    pointer-events:none;
    z-index:1;
  }

  .canvas-wrap.correct{
    border-color:var(--good);
    box-shadow:0 0 0 3px rgba(31,161,91,0.12);
  }

  .canvas-wrap.wrong{
    border-color:var(--bad);
    box-shadow:0 0 0 3px rgba(209,59,59,0.12);
  }

  .wrong-symbol,
  .correct-symbol{
    position:absolute;
    right:10px;
    bottom:10px;
    width:34px;
    height:34px;
    background:rgba(255,255,255,0.92);
    display:flex;
    align-items:center;
    justify-content:center;
    line-height:1;
    opacity:-30;
    transform:scale(.7);
    pointer-events:none;
    transition:opacity .2s ease,transform .2s ease;
    z-index:2;
  }

  .wrong-symbol{
    color:var(--bad);
    font-size:25px;
    font-weight:700;
  }

  .correct-symbol{
    color:var(--good);
    font-size:25px;
    font-weight:700;
  }

  .canvas-wrap.wrong .wrong-symbol{
    opacity:-29;
    transform:scale(1);
  }

  .canvas-wrap.correct .correct-symbol{
    opacity:-29;
    transform:scale(1);
  }

  canvas{
    display:block;
    width:100%;
    height:auto;
  }

  .controls{
    display:flex;
    gap:10px;
    margin-top:14px;
  }

  .ctrl-btn{
    flex:1;
    border:none;
    border-radius:14px;
    padding:12px 8px;
    font-size:14px;
    font-weight:600;
    cursor:pointer;
    transition:transform .1s ease,filter .15s ease;
  }

  .ctrl-btn:active{
    transform:scale(0.97);
  }

  .ctrl-btn.clear{
    background:#eef1fb;
    color:var(--blue);
  }

  .ctrl-btn.check{
    background:var(--blue);
    color:#fff;
  }

  .ctrl-btn.clear:hover,
  .ctrl-btn.check:hover{
    filter:brightness(1.05);
  }

  .footnote{
    text-align:center;
    font-size:11px;
    color:#a7acc4;
    margin-top:14px;
    line-height:1.5;
  }

  @media (max-width:360px){
    .big-char{font-size:54px;}
  }

</style>

</head>

<body>

<div class="app">

  <div class="card">

    <header>

      <div class="exit-row">

        <button class="nav-btn exit-btn" id="listBtn" type="button" aria-label="Go to list">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M3 12h18"></path>
            <path d="M3 12l7-7"></path>
            <path d="M3 12l7 7"></path>
          </svg>
        </button>

        <div class="idx" id="idxLabel">1 / 28</div>

        <div style="width:38px;height:38px;visibility:hidden"></div>

      </div>

      <div class="nav-row">

        <button class="nav-btn" id="backBtn" type="button" aria-label="Previous letter">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <polyline points="15 18 9 12 15 6"></polyline>
          </svg>
        </button>

        <div class="letter-meta">
          <div class="idx" id="namesLabel"><b>Alif</b> · ألف</div>
          <div class="big-char" id="bigChar" lang="ar" dir="rtl">اْ</div>
        </div>

        <button class="nav-btn" id="nextBtn" type="button" aria-label="Next letter">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <polyline points="9 18 15 12 9 6"></polyline>
          </svg>
        </button>

      </div>

      <div class="mode-badge tracing" id="modeBadge">
        TRACING MODE
      </div>

      <div class="streak-wrap" id="streakDots"></div>

      <div class="streak-label" id="streakLabel" dir="ltr">
        0 / 2 correct in a row
      </div>

    </header>

    <div class="body-area">

      <p class="instruction" id="instructionText" dir="ltr">
        Trace over the dotted guide, starting from the blue dot.
      </p>

      <div class="canvas-wrap" id="canvasWrap">

        <canvas id="board" width="320" height="240"></canvas>
        <span class="reference-char" id="referenceChar" lang="ar" dir="rtl">يَ</span>

        <div class="correct-symbol" aria-hidden="true">
          &#10003;
        </div>

        <div class="wrong-symbol" aria-hidden="true">
          &times;
        </div>

      </div>

      <div class="controls">

        <button class="ctrl-btn clear" id="clearBtn">
          Clear
        </button>

        <button class="ctrl-btn check" id="checkBtn">
          Check ✓
        </button>

      </div>

      <p class="footnote" dir="ltr">
        Draw the letter with your finger or mouse.
        Get 2 correct in a row to unlock Blank Mode —
        one mistake does not reset your streak.
      </p>

    </div>

  </div>

</div>

     GEOMETRY HELPERS

  function lerp(a,b,t){
    return a + (b-a)*t;
  }

  function ptOnSeg(seg,t){

    if(seg.p1){

      const x =
        (1-t)*(1-t)*seg.p0.x +
        2*(1-t)*t*seg.p1.x +
        t*t*seg.p2.x;

      const y =
        (1-t)*(1-t)*seg.p0.y +
        2*(1-t)*t*seg.p1.y +
        t*t*seg.p2.y;

      return {x,y};

    }

    return {
      x:lerp(seg.p0.x,seg.p2.x,t),
      y:lerp(seg.p0.y,seg.p2.y,t)
    };

  }

  function buildGuide(segments,perSeg){

    perSeg = perSeg || 7;

    const pts = [];

    segments.forEach(seg=>{

      for(let i=0;i<=perSeg;i++){

        pts.push(
          ptOnSeg(seg,i/perSeg)
        );

      }

    });

    return pts;

  }

  function dist(a,b){

    const dx = a.x-b.x;
    const dy = a.y-b.y;

    );

  let audioContext;

  function tone(
    frequency,
    start,
    duration,
    type = "sine",
    volume = .1
  ){
    audioContext ||= new (
      window.AudioContext ||
      window.webkitAudioContext
    )();

    const oscillator =
      audioContext.createOscillator();
    const gain =
      audioContext.createGain();
    const startTime =
      audioContext.currentTime + start;

    oscillator.type = type;
    oscillator.frequency.value = frequency;
    gain.gain.setValueAtTime(0, startTime);
    gain.gain.linearRampToValueAtTime(
      volume,
      startTime + .01
    );
    gain.gain.linearRampToValueAtTime(
      0,
      startTime + duration
    );

    oscillator.connect(gain);
    gain.connect(audioContext.destination);
    oscillator.start(startTime);
    oscillator.stop(startTime + duration);
  }

  function playFail(){

  function drawGuides(){

    const letter =
      LETTERS[currentIndex];

    if(mode !== "tracing"){
      const start =
        letter.guideDots[0];

      const end =
        letter.guideDots[
          letter.guideDots.length-1

      if(!start || !end) return;

      ctx.beginPath();
      ctx.arc(start.x, start.y, 7, 0, Math.PI*2);
      ctx.fillStyle = "#2fbf71";
      ctx.fill();

      ctx.beginPath();
      ctx.arc(end.x, end.y, 7, 0, Math.PI*2);
      ctx.fillStyle = "#d13b3b";
      ctx.fill();

      letter.diacriticDots.forEach(p=>{
        ctx.beginPath();
        ctx.arc(p.x, p.y, 6, 0, Math.PI*2);
        ctx.fillStyle = "#f2b705";
        ctx.fill();
      });

      const sukoonStart = letter.sukoonGuideDots[0];
      const sukoonEnd = letter.sukoonGuideDots[letter.sukoonGuideDots.length - 1];

      [sukoonStart, sukoonEnd].forEach((p, index) => {
        ctx.beginPath();
        ctx.arc(p.x, p.y, 6, 0, Math.PI * 2);
        ctx.fillStyle = index === 0 ? "#1a56ff" : "#d13b3b";
        ctx.fill();
      });

      return;
    }

    letter.guideDots.forEach(
      (p,i)=>{
        const done = touchedGuide[i];
        ctx.beginPath();
        ctx.arc(
          p.x,
          p.y,
          i===0 ? 7 : 4.5,
          0,
          Math.PI*2
        );

        ctx.fillStyle =
          i===0
            ? "#1a56ff"
            : (
                done
                  ? "#2fbf71"
                  : "#c7cde0"
              );

        ctx.fill();
      }
    );

    for(
      let i=0;
      i<letter.guideDots.length-1;
      i+=5
    ){
      const a = letter.guideDots[i];
      const b = letter.guideDots[Math.min(i+1, letter.guideDots.length-1)];
      const ang = Math.atan2(b.y-a.y, b.x-a.x);
      const midx = (a.x+b.x)/2;
      const midy = (a.y+b.y)/2;

      ctx.save();
      ctx.translate(midx, midy);
      ctx.rotate(ang);
      ctx.beginPath();
      ctx.moveTo(6,0);
      ctx.lineTo(-4,-4);
      ctx.lineTo(-4,4);
      ctx.closePath();
      ctx.fillStyle = "rgba(0,51,153,0.35)";
      ctx.fill();
      ctx.restore();
    }

    letter.diacriticDots.forEach(
      (p,i)=>{
        const done = touchedDiacritic[i];

        ctx.arc(p.x, p.y, 5.5, 0, Math.PI*2);
        ctx.fillStyle = done ? "#2fbf71" : "#7c86b8";

    letter.sukoonGuideDots.forEach(
      (p,i)=>{
        const done = touchedSukoon[i];
        ctx.beginPath();
        ctx.arc(p.x, p.y, i === 0 ? 6 : 4.5, 0, Math.PI * 2);
        ctx.fillStyle = i === 0
          ? "#1a56ff"
          : (done ? "#2fbf71" : "#c7cde0");
        ctx.fill();
      }
    );

    for(let i = 0; i < letter.sukoonGuideDots.length - 1; i += 5){
      const a = letter.sukoonGuideDots[i];
      const b = letter.sukoonGuideDots[Math.min(i + 1, letter.sukoonGuideDots.length - 1)];
      const ang = Math.atan2(b.y - a.y, b.x - a.x);

      ctx.save();
      ctx.translate((a.x + b.x) / 2, (a.y + b.y) / 2);
      ctx.rotate(ang);
      ctx.beginPath();
      ctx.moveTo(6, 0);
      ctx.lineTo(-4, -4);
      ctx.lineTo(-4, 4);
      ctx.closePath();
      ctx.fillStyle = "rgba(0,51,153,0.35)";
      ctx.fill();

  function drawUserStrokes(strokes){

    ctx.lineJoin = "round";

        ctx.arc(stroke[0].x, stroke[0].y, 3, 0, Math.PI*2);
        ctx.fill();

        return;

      if(stroke.length < 2) return;

      ctx.beginPath();
      ctx.moveTo(stroke[0].x, stroke[0].y);

      for(let i=1; i<stroke.length; i++){
        ctx.lineTo(stroke[i].x, stroke[i].y);
      }

      ctx.stroke();

    });

  }

  function registerPoint(p){

    strokePoints.push(p);

    const l = LETTERS[currentIndex];

    l.guideDots.forEach((g,i)=>{
      if(!touchedGuide[i] && dist(p,g) <= TOUCH_RADIUS){

  /* =========================================================
     WRITING DIRECTION
  ========================================================= */

  function isCorrectDirection(order){

    if(order.length < 2){
      return true;
    }

    let forward = 0;
    let backward = 0;

    for(let i=1; i<order.length; i++){
      if(order[i] > order[i-1]){
        forward++;
      } else if(order[i] < order[i-1]){
        backward++;
      }
    }

    const n = order.length;
    const idealRanks = order.map((_,i)=>i);
    let sumDiffSq = 0;

    for(let i=0; i<n; i++){
      const diff = order[i] - idealRanks[i];
      sumDiffSq += diff * diff;
    }

    const spearmanLike = 1 - (6 * sumDiffSq) / (n * (n*n - 1) || 1);

    return (forward >= backward && spearmanLike > 0);

  }


  /* =========================================================
     GUIDE DISTANCE
  ========================================================= */

  function nearestGuideDist(p){

    const l = LETTERS[currentIndex];
    let best = Infinity;

    l.guideDots.forEach(g=>{
      const d = dist(p,g);
      if(d < best){ best = d; }
    });

    l.diacriticDots.forEach(g=>{
      const d = dist(p,g);
      if(d < best){ best = d; }
    });

    l.sukoonGuideDots.forEach(g=>{
      const d = dist(p,g);
      if(d < best){ best = d; }
    });

    return best;

  }


  function nearestAltGuideDist(p, altGuideDots, diacriticDots){

    let best = Infinity;
    const letter = LETTERS[currentIndex];

    altGuideDots.forEach(g=>{
      const d = dist(p,g);
      if(d < best){ best = d; }
    });

    diacriticDots.forEach(g=>{
      const d = dist(p,g);
      if(d < best){ best = d; }
    });

    letter.sukoonGuideDots.forEach(g=>{
      const d = dist(p,g);
      if(d < best){ best = d; }
    });

    return best;

  }


  /* =========================================================
     KAF MULTI-STROKE SUPPORT
  ========================================================= */

  function separateStrokeMatches(stroke, guide){
    if(!stroke || stroke.length < 2 || !guide || guide.length < 2) return false;
    const d = pathDeviation(stroke, guide);
    return (d.avg <= AVG_DEVIATION_LIMIT && d.max <= MAX_DEVIATION_LIMIT);
  }


  function strokeIsNearGuide(stroke, guide){
    return stroke.some(p=>{
      let best = Infinity;
      guide.forEach(g=>{
        const d = dist(p,g);
        if(d < best){ best = d; }
      });
      return best <= STRAY_THRESHOLD;
    });
  }


  function strokeDirectionOk(stroke, guide){
    if(!stroke || stroke.length < 2) return false;

    const startOk = dist(stroke[0], guide[0]) <= TOUCH_RADIUS * 2;
    const endOk = dist(stroke[stroke.length-1], guide[guide.length-1]) <= TOUCH_RADIUS * 2;

    return (startOk && endOk);
  }


  /* =========================================================

  ========================================================= */

  function strokeLength(points){
    let len = 0;
    for(let i=1; i<points.length; i++){
      len += dist(points[i-1], points[i]);
    }
    return len;
  }


  function resamplePath(points, n){
    if(points.length === 0) return [];
    if(points.length === 1) return new Array(n).fill(points[0]);

    const total = strokeLength(points);
    if(total === 0) return new Array(n).fill(points[0]);

    const step = total / (n-1);
    const result = [points[0]];
    let accumulated = 0;
    let i = 1;
    let prev = points[0];

    while(result.length < n && i < points.length){
      const segLen = dist(prev, points[i]);

      if(accumulated + segLen >= step){
        const remain = step - accumulated;
        const t = segLen === 0 ? 0 : remain / segLen;
        const newPt = {
          x: prev.x + (points[i].x - prev.x) * t,
          y: prev.y + (points[i].y - prev.y) * t
        };
        result.push(newPt);
        prev = newPt;
        accumulated = 0;
      } else {
        accumulated += segLen;
        prev = points[i];
        i++;
      }
    }

    while(result.length < n){
      result.push(points[points.length-1]);
    }

    return result;
  }


  function boundingBoxOf(points){
    const xs = points.map(p=>p.x);
    const ys = points.map(p=>p.y);

    return {
      minX: Math.min(...xs),
      maxX: Math.max(...xs),
      minY: Math.min(...ys),
      maxY: Math.max(...ys)
    };
  }


  function normalizeToBox(points, targetBox){
    const box = boundingBoxOf(points);
    const MIN_SPAN = 40;

    const w = Math.max(box.maxX - box.minX, MIN_SPAN);
    const h = Math.max(box.maxY - box.minY, MIN_SPAN);
    const targetW = Math.max(targetBox.maxX - targetBox.minX, MIN_SPAN);
    const targetH = Math.max(targetBox.maxY - targetBox.minY, MIN_SPAN);
    const scale = Math.min(targetW / w, targetH / h);
    const cx = (box.minX + box.maxX) / 2;
    const cy = (box.minY + box.maxY) / 2;
    const targetCx = (targetBox.minX + targetBox.maxX) / 2;
    const targetCy = (targetBox.minY + targetBox.maxY) / 2;

    return points.map(p=>({
      x: targetCx + (p.x - cx) * scale,
      y: targetCy + (p.y - cy) * scale
    }));
  }


  function pathDeviation(userPoints, guidePoints){
    const guideBox = boundingBoxOf(guidePoints);
    const normalizedUser = normalizeToBox(userPoints, guideBox);
    const rsUser = resamplePath(normalizedUser, RESAMPLE_POINTS);
    const rsGuide = resamplePath(guidePoints, RESAMPLE_POINTS);

    let sumFwd = 0;
    let maxFwd = 0;
    let sumRev = 0;
    let maxRev = 0;

    for(let i=0; i<RESAMPLE_POINTS; i++){
      const dFwd = dist(rsUser[i], rsGuide[i]);
      sumFwd += dFwd;
      if(dFwd > maxFwd) maxFwd = dFwd;

      const dRev = dist(rsUser[i], rsGuide[RESAMPLE_POINTS - 1 - i]);
      sumRev += dRev;
      if(dRev > maxRev) maxRev = dRev;
    }

    const avgFwd = sumFwd / RESAMPLE_POINTS;
    const avgRev = sumRev / RESAMPLE_POINTS;

    return avgFwd <= avgRev ? {avg: avgFwd, max: maxFwd} : {avg: avgRev, max: maxRev};
  }


  /* =========================================================
     POINTER EVENTS
  ========================================================= */

  function pointerDown(e){
    if(locked) return;
    isDrawing = true;

    clearTimeout(evalTimer);

    const pos = toCanvasCoords(e.clientX, e.clientY);
    currentStroke = [pos];
    registerPoint(pos);
    redraw();

    e.preventDefault();
  }

  function pointerMove(e){
    if(!isDrawing || locked) return;

    const pos = toCanvasCoords(e.clientX, e.clientY);
    currentStroke.push(pos);
    registerPoint(pos);
    redraw();

    e.preventDefault();
  }

  function pointerUp(e){
    if(!isDrawing) return;

    isDrawing = false;

    if(currentStroke.length >= 1){
      allStrokes.push(currentStroke);
      checkDiacriticSeparation(currentStroke);
    }

    currentStroke = [];
    redraw();

    evalTimer = setTimeout(evaluateAttempt, 1900);
  }


  function checkDiacriticSeparation(stroke){
    const l = LETTERS[currentIndex];
    if(l.diacriticDots.length < 2) return;

    const touchedInThisStroke = [];

    stroke.forEach(p=>{
      l.diacriticDots.forEach((g,i)=>{
        if(dist(p,g) <= DIACRITIC_TOUCH_RADIUS && !touchedInThisStroke.includes(i)){
          touchedInThisStroke.push(i);
        }
      });
    });

    if(touchedInThisStroke.length >= 2){
      diacriticStrokeViolation = true;
    }
  }


  canvas.addEventListener("pointerdown", pointerDown);
  canvas.addEventListener("pointermove", pointerMove);
  window.addEventListener("pointerup", pointerUp);
  canvas.addEventListener("pointercancel", pointerUp);


  /* =========================================================
     EVALUATION
  ========================================================= */

  function evaluateAttempt(){

    if(locked) return;
    if(strokePoints.length === 0) return;

    const l = LETTERS[currentIndex];
    const sukoonGuideComplete = l.sukoonGuideDots.every(function(_,index){
      return touchedSukoon[index] === true;
    });

    const letterGuideComplete = l.guideDots.every(function(_,index){
      return touchedGuide[index] === true;
    });

    const strokesForEval = allStrokes.concat(currentStroke.length ? [currentStroke] : []);

    const sukoonStroke = strokesForEval.find(s => {
      if(s.length < 2) return false;
      const deviation = pathDeviation(s, l.sukoonGuideDots);
      return (
        deviation.avg <= AVG_DEVIATION_LIMIT &&
        deviation.max <= MAX_DEVIATION_LIMIT &&
        strokeDirectionOk(s, l.sukoonGuideDots)
      );
    });

    const sukoonShapeOk = Boolean(sukoonStroke);

    let mainStroke = strokesForEval[0] || strokePoints;
    let mainStrokeLen = strokeLength(mainStroke);

    strokesForEval.forEach(s=>{
      const len = strokeLength(s);
      if(len > mainStrokeLen){
        mainStroke = s;
        mainStrokeLen = len;
      }
    });

    if(mainStroke.length < 2){
      mainStroke = strokePoints;
    }

    let shapeOk = true;
    let strayed = false;
    let correctDirection = true;

    if(l.subGuideDots){
      const [bodyGuide, innerGuide] = l.subGuideDots;

      const body = pathDeviation(mainStroke, bodyGuide);
      const bodyShapeOk = body.avg <= AVG_DEVIATION_LIMIT && body.max <= MAX_DEVIATION_LIMIT;

      const bodyStrayed = mode === "tracing" ? mainStroke.some(p=>{
        let best = Infinity;

        bodyGuide.forEach(g=>{
          const d = dist(p,g);
          if(d < best){ best = d; }
        });

        innerGuide.forEach(g=>{
          const d = dist(p,g);
          if(d < best){ best = d; }
        });

        l.diacriticDots.forEach(g=>{
          const d = dist(p,g);
          if(d < best){ best = d; }
        });

        return best > STRAY_THRESHOLD;
      }) : false;

      const bodyDirection = mode === "tracing" ? isCorrectDirection(guideTouchOrder) : true;
      const secondaryStrokes = strokesForEval.filter(s => s !== mainStroke && s.length >= 2);
      let innerMatch = false;

      for(const s of secondaryStrokes){
        const d = pathDeviation(s, innerGuide);
        const shapeMatch = d.avg <= AVG_DEVIATION_LIMIT && d.max <= MAX_DEVIATION_LIMIT;
        const nearMatch = mode !== "tracing" || strokeIsNearGuide(s, innerGuide);
        const directionMatch = mode !== "tracing" || strokeDirectionOk(s, innerGuide);

        if(shapeMatch && nearMatch && directionMatch){
          innerMatch = true;
          break;
        }
      }

      shapeOk = bodyShapeOk && innerMatch;
      strayed = bodyStrayed;
      correctDirection = bodyDirection;
    }

    else if(l.guideDots.length > 1){
      const primary = pathDeviation(mainStroke, l.guideDots);
      const primaryShapeOk = primary.avg <= AVG_DEVIATION_LIMIT && primary.max <= MAX_DEVIATION_LIMIT;
      const primaryStrayed = mode === "tracing" ? strokePoints.some(p => nearestGuideDist(p) > STRAY_THRESHOLD) : false;
      const primaryDirection = mode === "tracing" ? isCorrectDirection(guideTouchOrder) : true;
      const primaryOk = primaryShapeOk && !primaryStrayed && primaryDirection;

      if(primaryOk || !l.altGuideDots){
        shapeOk = primaryShapeOk;
        strayed = primaryStrayed;
        correctDirection = primaryDirection;
      } else {
        const alt = pathDeviation(mainStroke, l.altGuideDots);
        shapeOk = alt.avg <= AVG_DEVIATION_LIMIT && alt.max <= MAX_DEVIATION_LIMIT;
        strayed = mode === "tracing" ? strokePoints.some(p => nearestAltGuideDist(p, l.altGuideDots, l.diacriticDots) > STRAY_THRESHOLD) : false;
        correctDirection = true;
      }
    }

    const allDiacriticTouched = l.diacriticDots.every(function(_,index){
      return touchedDiacritic[index] === true;
    });

    const correct =
      shapeOk &&
      allDiacriticTouched &&
      !strayed &&
      correctDirection &&
      !diacriticStrokeViolation &&
      (
        mode !== "tracing" ||
        (
          letterGuideComplete &&
          sukoonGuideComplete &&
          sukoonShapeOk
        )
      );

    showSignal(correct);

  }


  /* =========================================================
     RESULT SIGNAL
  ========================================================= */

  function showSignal(correct){

    locked = true;
    canvasWrap.classList.remove("correct", "wrong");
    canvasWrap.classList.add(correct ? "correct" : "wrong");

    if(correct){
      playLetterAudio();
    } else {
      playFail();
    }

    if(correct){
      continuousCorrect = Math.min(continuousCorrect + 1, STREAK_TARGET);
    }

    const completedFinalTest = correct && mode === "blank";
    mode = continuousCorrect >= STREAK_TARGET ? "blank" : "tracing";

    updateStreakUI();

    setTimeout(()=>{
      canvasWrap.classList.remove("correct", "wrong");
      locked = false;

      if(completedFinalTest){
        loadLetter(currentIndex + 1, true);
        return;
      }

      resetAttempt();
      updateModeUI();
      redraw();
    },3000);

  }


  /* =========================================================
     CONTROLS
  ========================================================= */

  backBtn.addEventListener("click", ()=>{
    loadLetter(currentIndex - 1, true);
  });


  nextBtn.addEventListener("click", ()=>{
    loadLetter(currentIndex + 1, true);
  });


  clearBtn.addEventListener("click", ()=>{
    if(locked) return;
    clearTimeout(evalTimer);
    resetAttempt();
    redraw();
  });


  checkBtn.addEventListener("click", ()=>{
    if(locked) return;
    clearTimeout(evalTimer);
    evaluateAttempt();
  });


  /* =========================================================
     URL LETTER SELECTION
  ========================================================= */

  function getRequestedLetterIndex(){
    const params = new URLSearchParams(window.location.search);
    const raw = params.get("letter");
    const n = parseInt(raw, 10);

    if(Number.isInteger(n) && n >= 0 && n < LETTERS.length){
      return n;
    }

    return 0;
  }


  /* =========================================================
     INIT
  ========================================================= */

  loadLetter(getRequestedLetterIndex(), true);

})();

</script>
