<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>THAJWEED CLASS</title>
    <link rel="stylesheet" href="../../style.css">
    <style>
        /* --- THAJWEED ACTION CARD --- */
        .student-action-card { 
            background: #ffffff; 
            margin: 20px auto; 
            border-radius: 20px; 
            padding: 24px; 
            box-shadow: 0 4px 20px rgba(0,0,0,0.05); 
            max-width: 1200px;
        }

        .lesson-1 { 
            background-image: url(../../images/Banner/lesson-1-banner.webp); 
            background-size: cover; 
            background-position: center; 
            border-radius: 16px; 
            padding: 16px 20px; 
            box-shadow: 0 4px 15px rgba(0,0,0,0.05); 
        }

        .student-action-card h3 { 
            margin: 0 0 10px; 
            font-size: 18px; 
            color: #5C4B37; 
            display: flex; 
            align-items: center; 
            gap: 8px; 
            position: relative; 
            padding-right: 28px;
            cursor: pointer; 
        }

        .student-action-card h3::after {
            content: '▾';
            position: absolute;
            right: 12px;
            font-size: 18px;
            transition: transform 0.2s ease;
            color: #5C4B37;
        }

        .student-action-card.open h3::after {
            transform: rotate(180deg);
        }

        .student-action-card .video-list { display: none; }
        .student-action-card.open .video-list { display: grid; }

        /* --- RESPONSIVE VIDEO GRID (2 Columns on Mobile, Multi-column on Desktop) --- */
        .video-list { 
            display: grid; 
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); 
            gap: 18px; 
            margin-top: 20px; 
            width: 100%;
        }

        @media (max-width: 480px) {
            .video-list {
                grid-template-columns: repeat(2, 1fr);
                gap: 12px;
            }
            .student-action-card {
                padding: 16px;
                margin: 12px;
            }
        }

        .video-card { 
            width: 100%; 
            display: flex; 
            flex-direction: column; 
            gap: 10px; 
            background: #ffffff; 
            border-radius: 16px; 
            padding: 12px; 
            box-shadow: 0 4px 15px rgba(0,0,0,0.05); 
            box-sizing: border-box;
            transition: transform 0.2s ease;
        }

        .video-card:hover {
            transform: translateY(-2px);
        }

        .video-card-row { 
            display: flex; 
            flex-direction: column; 
            gap: 10px; 
            align-items: center; 
        }

        .thumb-wrap { 
            position: relative; 
            width: 100%; 
        }

        .video-thumb { 
            width: 100%; 
            height: 120px; 
            object-fit: cover; 
            border-radius: 12px; 
            display: block; 
        }

        .play-overlay { 
            position: absolute; 
            left: 50%; 
            top: 50%; 
            transform: translate(-50%, -50%); 
            width: 40px; 
            height: 40px; 
            border: 0; 
            padding: 0; 
            background: rgba(0,0,0,0.6); 
            border-radius: 50%; 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            cursor: pointer; 
            transition: background 0.2s ease;
        }

        .play-overlay:hover {
            background: rgba(0,0,0,0.8);
        }

        .play-overlay svg { 
            width: 20px; 
            height: 20px; 
            fill: #fff; 
        }

        .video-title { 
            font-size: 13px; 
            font-weight: 700; 
            color: #1f2937; 
            text-align: center;
        }

        /* --- CLEAN VIDEO PLAYER LIGHTBOX MODAL --- */
        .video-modal-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.75);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 9999;
            padding: 16px;
            box-sizing: border-box;
            backdrop-filter: blur(4px);
            -webkit-backdrop-filter: blur(4px);
        }

        .video-modal-overlay.open {
            display: flex;
        }

        .video-modal-card {
            position: relative;
            width: 100%;
            max-width: 800px;
            background: #ffffff;
            border-radius: 20px;
            padding: 16px;
            box-sizing: border-box;
            box-shadow: 0 20px 50px rgba(0,0,0,0.4);
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .video-modal-header {
            display: flex;
            justify-content: flex-end;
            align-items: center;
            width: 100%;
        }

        .video-modal-actions {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .video-modal-btn {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            background: #f1f5f9;
            color: #1e293b;
            border: none;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: background 0.2s ease;
            text-decoration: none;
        }

        .video-modal-btn:hover {
            background: #e2e8f0;
        }

        .video-modal-btn svg {
            width: 18px;
            height: 18px;
            stroke: currentColor;
        }

        .video-modal-btn.close-btn {
            font-size: 18px;
            font-weight: bold;
        }

        .video-player-wrapper {
            width: 100%;
            border-radius: 12px;
            overflow: hidden;
            background: #000000;
        }

        .video-player-wrapper video {
            width: 100%;
            height: auto;
            max-height: 75vh;
            display: block;
            border-radius: 12px;
        }

        /* Menu Styles */
        .menu-btn { font-size: 22px; width: 42px; height: 42px; border-radius: 50%; border: none; background: transparent; cursor: pointer; }
        .menu-backdrop { position: fixed; inset: 0; background: rgba(0,0,0,0.24); opacity: 0; visibility: hidden; transition: opacity 0.28s ease; z-index: 1050; }
        .menu-backdrop.open { opacity: 1; visibility: visible; }
        .side-menu { position: fixed; top: 0; right: -100%; width: 60vw; max-width: 340px; height: 100vh; background: #fff; box-shadow: -18px 0 45px rgba(0,0,0,0.12); z-index: 1100; transition: right 0.28s ease; display: flex; flex-direction: column; padding: 32px; }
        .side-menu.open { right: 0; }
        .side-menu .menu-close-btn { margin-left: auto; border: none; background: transparent; font-size: 28px; cursor: pointer; }
        .side-menu .menu-title { margin: 0; font-size: 22px; color: #888; font-weight: 700; letter-spacing: 0.18em; }
        .side-menu .menu-list { margin-top: 48px; display: flex; flex-direction: column; gap: 28px; }
        .side-menu .menu-list button { border: none; background: transparent; text-align: left; font-size: 14px; font-weight: 600; cursor: pointer; }
        .side-menu .menu-list button + button { padding-top: 28px; border-top: 1px solid rgba(0,0,0,0.08); }
    </style>
</head>
<body>
    <div class="app-container">
        <!-- Dashboard Header -->
        <header class="dash-header">
            <div class="user-info">
                <div>
                    <h2 style="margin:0;">THAJWEED CLASS</h2>
                </div>
            </div>
            <div class="header-actions">
                <button class="menu-btn" id="btn-menu" type="button" aria-label="Open menu">☰</button>
            </div>
        </header>

        <!-- Side Navigation Menu -->
        <div id="thajweed-menu-backdrop" class="menu-backdrop"></div>
        <aside id="thajweed-side-menu" class="side-menu" aria-hidden="true">
            <button type="button" class="menu-close-btn" id="btn-menu-close">×</button>
            <p class="menu-title">UK QURAN</p>
            <div class="menu-list">
                <button type="button" id="btn-menu-home">HOME</button>
                <button type="button" id="btn-menu-thajweed">THAJWEED</button>
                <button type="button" id="btn-menu-qiraat">QIRA'AT</button>
                <button type="button" id="btn-menu-certificates">CERTIFICATES</button>
                <button type="button" id="btn-menu-logout">LOGOUT</button>
            </div>
        </aside>

        <!-- Lesson 1 Section -->
        <div class="student-action-card open">
            <div class="lesson-1">
                <h3 style="margin-left: 22px; margin-top: 20px;">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"></path><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"></path></svg>
                    Lesson 1
                </h3>
                <p style="margin-left: 22px; margin-right: 22px; font-size: 14px;">
                    Arabic letters
                </p>
            </div>
            
            <div class="video-list" id="video-list"></div> 
        </div> 
    </div>

    <!-- Video Modal Lightbox -->
    <div id="video-modal" class="video-modal-overlay">
        <div class="video-modal-card">
            <div class="video-modal-header">
                <div class="video-modal-actions">
                    <a id="video-modal-download" class="video-modal-btn" href="#" download title="Download Video">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v12"></path><path d="m7 10 5 5 5-5"></path><path d="M5 21h14"></path></svg>
                    </a>
                    <button id="video-modal-fullscreen" class="video-modal-btn" type="button" title="Fullscreen">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 3h6v6"></path><path d="m21 3-7 7"></path><path d="M9 21H3v-6"></path><path d="m3 21 7-7"></path></svg>
                    </button>
                    <button id="video-modal-close" class="video-modal-btn close-btn" type="button" title="Close">✕</button>
                </div>
            </div>
            <div class="video-player-wrapper" id="video-player-wrapper">
                <!-- Video tag dynamically inserted -->
            </div>
        </div>
    </div>

    <script> 
        const videoFiles = [
            'PART- 1.mp4', 'PART- 2.mp4', 'PART- 3.mp4', 'PART- 4.mp4',
            'PART- 5.mp4', 'PART- 6.mp4', 'PART- 7.mp4', 'PART- 8.mp4',
            'PART- 9.mp4', 'PART- 10.mp4', 'PART- 11.mp4', 'PART- 12.mp4',
            'PART- 13.mp4', 'PART- 14.mp4', 'PART- 15.mp4', 'PART- 16.mp4',
            'PART- 17.mp4', 'PART- 18.mp4', 'PART- 19.mp4', 'PART- 20.mp4',
            'PART- 21.mp4', 'PART- 22.mp4', 'PART- 23.mp4', 'PART- 24.mp4',
            'PART- 25.mp4', 'PART- 26.mp4', 'PART- 27.mp4', 'PART- 28.mp4'
        ];

        function extractPartNumber(name) {
            const match = name.match(/PART\s*-?\s*(\d+)/i);
            return match ? Number(match[1]) : Number.MAX_SAFE_INTEGER;
        }

        videoFiles.sort((a, b) => extractPartNumber(a) - extractPartNumber(b));

        const videoList = document.getElementById('video-list');
        const defaultThumb = '../../images/arabic-letters/PART- 2.webp';
        const thumbSrc = (partNum) => `../../images/arabic-letters/PART- ${partNum}.webp`;

        function getVideoUrl(fileName) {
            return '../../videos/arabic-letters/' + encodeURIComponent(fileName);
        }

        // Render Video Cards Grid
        videoFiles.forEach((fileName, index) => {
            const card = document.createElement('div');
            card.className = 'video-card';

            const row = document.createElement('div');
            row.className = 'video-card-row';

            const partNum = extractPartNumber(fileName);
            const thumb = document.createElement('img');
            thumb.className = 'video-thumb';
            thumb.src = partNum !== Number.MAX_SAFE_INTEGER ? thumbSrc(partNum) : defaultThumb;
            thumb.alt = 'Thumbnail part ' + (partNum !== Number.MAX_SAFE_INTEGER ? partNum : index + 1);
            thumb.onerror = () => { thumb.onerror = null; thumb.src = defaultThumb; };

            const thumbWrap = document.createElement('div');
            thumbWrap.className = 'thumb-wrap';
            thumbWrap.appendChild(thumb);

            const playButton = document.createElement('button');
            playButton.className = 'play-overlay';
            playButton.type = 'button';
            playButton.innerHTML = '<svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>';
            thumbWrap.appendChild(playButton);

            const title = document.createElement('div');
            title.className = 'video-title';
            title.textContent = partNum !== Number.MAX_SAFE_INTEGER ? `Class - ${partNum}` : `Class - ${index + 1}`;

            playButton.addEventListener('click', (e) => {
                e.stopPropagation();
                openModal(fileName);
            });

            card.addEventListener('click', () => {
                openModal(fileName);
            });

            row.appendChild(thumbWrap);
            row.appendChild(title);
            card.appendChild(row);
            videoList.appendChild(card);
        });

        // Collapsible Lesson Card
        const actionCard = document.querySelector('.student-action-card');
        actionCard.querySelector('h3').addEventListener('click', () => {
            actionCard.classList.toggle('open');
        });

        // Modal Handling
        const videoModal = document.getElementById('video-modal');
        const videoWrapper = document.getElementById('video-player-wrapper');
        const videoModalDownload = document.getElementById('video-modal-download');
        const videoModalFullscreen = document.getElementById('video-modal-fullscreen');
        const videoModalClose = document.getElementById('video-modal-close');

        function openModal(fileName) {
            videoWrapper.innerHTML = '';

            const video = document.createElement('video');
            video.controls = true;
            video.autoplay = true;
            video.playsInline = true;
            video.src = getVideoUrl(fileName);

            videoWrapper.appendChild(video);

            if (videoModalDownload) {
                videoModalDownload.href = getVideoUrl(fileName);
                videoModalDownload.download = fileName;
            }

            videoModal.classList.add('open');
            document.body.classList.add('modal-open');
        }

        function closeModal() {
            const video = videoWrapper.querySelector('video');
            if (video) {
                try { video.pause(); } catch(e) {}
                videoWrapper.innerHTML = '';
            }
            videoModal.classList.remove('open');
            document.body.classList.remove('modal-open');
        }

        if (videoModalClose) videoModalClose.addEventListener('click', closeModal);
        if (videoModal) {
            videoModal.addEventListener('click', (e) => {
                if (e.target === videoModal) closeModal();
            });
        }

        if (videoModalFullscreen) {
            videoModalFullscreen.addEventListener('click', () => {
                const video = videoWrapper.querySelector('video');
                if (!video) return;
                if (video.requestFullscreen) {
                    video.requestFullscreen();
                } else if (video.webkitEnterFullscreen) {
                    video.webkitEnterFullscreen();
                } else if (video.webkitRequestFullscreen) {
                    video.webkitRequestFullscreen();
                }
            });
        }

        // Guest vs Student Side Menu Check
        const isGuest = sessionStorage.getItem('isGuest') === 'true';
        const btnMenuCertificates = document.getElementById('btn-menu-certificates');
        const btnMenuLogout = document.getElementById('btn-menu-logout');

        if (isGuest) {
            if (btnMenuCertificates) btnMenuCertificates.style.display = 'none';
            if (btnMenuLogout) btnMenuLogout.textContent = 'EXIT GUEST MODE';
        }

        const btnMenu = document.getElementById('btn-menu');
        const thajweedMenuBackdrop = document.getElementById('thajweed-menu-backdrop');
        const thajweedSideMenu = document.getElementById('thajweed-side-menu');
        const btnMenuClose = document.getElementById('btn-menu-close');
        const btnMenuHome = document.getElementById('btn-menu-home');

        const openMenu = () => {
            thajweedSideMenu.classList.add('open');
            thajweedMenuBackdrop.classList.add('open');
        };

        const closeMenu = () => {
            thajweedSideMenu.classList.remove('open');
            thajweedMenuBackdrop.classList.remove('open');
        };

        btnMenu?.addEventListener('click', openMenu);
        btnMenuClose?.addEventListener('click', closeMenu);
        thajweedMenuBackdrop?.addEventListener('click', closeMenu);

        btnMenuHome?.addEventListener('click', () => {
            closeMenu();
            window.location.href = isGuest ? '../Guest/guest.html' : '../Student/student.html';
        });

        document.getElementById('btn-menu-thajweed')?.addEventListener('click', () => {
            closeMenu();
            window.location.href = 'thajweed.html';
        });

        document.getElementById('btn-menu-qiraat')?.addEventListener('click', () => {
            closeMenu();
            window.location.href = '../Qira\'at/qiraat.html';
        });

        btnMenuCertificates?.addEventListener('click', () => {
            closeMenu();
            window.location.href = '../Certificates/certificates.html';
        });

        btnMenuLogout?.addEventListener('click', () => {
            closeMenu();
            if (isGuest) sessionStorage.removeItem('isGuest');
            window.location.href = '../../index.html';
        });
    </script>
</body>
</html>
