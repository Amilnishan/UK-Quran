<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QIRA'AT</title>
    <link rel="stylesheet" href="../../style.css">
    <style>
        .student-action-card {
            background: #ffffff;
            margin: 20px 32px;
            border-radius: 20px;
            padding: 24px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.05);
            box-sizing: border-box;
            width: calc(100% - 64px); /* Matches header 32px side paddings symmetrically */
            max-width: 1280px;
        }
        .student-action-card h3 {
            margin: 0 0 10px;
            font-size: 16px;
            color: #5C4B37;
            display: flex;
            align-items: center;
            gap: 8px;
            cursor: pointer;
            user-select: none;
            position: relative;
            padding-right: 28px;
        }
        .student-action-card h3::after {
            content: '▾';
            position: absolute;
            right: 12px;
            font-size: 16px;
            transition: transform 0.2s ease;
            color: #5C4B37;
        }
        .student-action-card.open h3::after {
            transform: rotate(180deg);
        }
        .student-action-card p {
            margin: 0 0 10px;
            font-size: 14px;
            color: #444;
        }
        @media (max-width: 768px) {
            .student-action-card {
                margin: 16px 16px;
                width: calc(100% - 32px);
                padding: 16px;
            }
        }

        .qiraat {
            height: 100px;
            background-image: url(../../images/Banner/banner-3-reverse.webp), url(images/Banner/banner-3-reverse.webp);
            background-size: cover;
            background-position: center;
            border-radius: 16px;
            padding: 16px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
            box-sizing: border-box;
            width: 100%;
        }
        .fathiha {
            height: 100px;
            background-image: url(../../images/Banner/banner-2-reverse.webp), url(images/Banner/banner-2-reverse.webp);
            background-size: cover;
            background-position: center;
            border-radius: 16px;
            padding: 16px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
            box-sizing: border-box;
            width: 100%;
        }        

        .audio-list {
            display: none;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); 
            gap: 16px;
            margin-top: 20px;
            width: 100%;
            box-sizing: border-box;
        }
        .audio-search {
            grid-column: 1 / -1;
            width: 100%;
            margin-bottom: 8px;
        }
        .audio-search input {
            width: 100% !important;
            height: 44px;
            padding: 0 18px;
            border-radius: 999px;
            border: 1px solid #e2e8f0;
            font-size: 14px;
            box-sizing: border-box;
            background: #ffffff;
        }
        .student-action-card.open .audio-list {
            display: grid;
        }
        .audio-card {
            background: #ffffff;
            border-radius: 16px;
            padding: 14px 16px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
            border: 1px solid #f1f5f9;
            display: flex;
            flex-direction: column;
            gap: 10px;
            width: 100% !important; /* Expands to full cell width, eliminating right side gap */
            box-sizing: border-box;
        }
        .audio-row {
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .audio-play-button {
            width: 34px;
            height: 34px;
            border: none;
            border-radius: 50%;
            background: #f1f3f4;
            color: #1f2937;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: background 0.2s ease;
        }
        .audio-play-button:hover {
            background: #e2e8f0;
        }
        .audio-play-button.playing,
        .audio-play-button.hidden {
            display: none;
        }
        .audio-play-button svg {
            width: 16px;
            height: 16px;
            fill: currentColor;
        }
        .audio-title {
            font-size: 12px;
            font-weight: 520;
            color: #1f2937;
            line-height: 1.4;
            word-break: break-word;
        }
        .audio-controls {
            width: 100%;
            height: 35px;
            margin-top: 10px;
        }
        .toggle-label {
            margin-left: 7px;
            font-size: 14px;
            color: #444;
        }

        #surah-card .video-list {
            display: none;
            grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
            gap: 16px;
            margin-top: 18px;
        }

        #surah-card.open .video-list {
            display: grid;
        }

        .video-card {
            background: #ffffff;
            border-radius: 18px;
            padding: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
            border: 1px solid rgba(15, 23, 42, 0.06);
            cursor: pointer;
            transition: transform 0.2s ease, box-shadow 0.2s ease;
        }

        .video-card:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(15, 23, 42, 0.08);
        }

        .video-card-row {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .thumb-wrap {
            position: relative;
            width: 100%;
            border-radius: 14px;
            overflow: hidden;
            background: #edf2f7;
            aspect-ratio: 16 / 9;
        }

        .video-thumb {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }

        .play-overlay {
            position: absolute;
            left: 50%;
            top: 50%;
            transform: translate(-50%, -50%);
            width: 38px;
            height: 38px;
            border: none;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            background: rgba(0, 0, 0, 0.72);            cursor: pointer;
            transition: background 0.2s ease, transform 0.2s ease;
            box-shadow: 0 8px 18px rgba(15, 23, 42, 0.2);
        }

        .play-overlay:hover {
            background: rgb(0, 0, 0);
        }

        .play-overlay svg {
            width: 36px;
            height: 36px;
            fill: #ffffff;
            filter: drop-shadow(0 2px 8px rgba(0,0,0,0.25));
        }

        .video-title {
            font-size: 13px;
            font-weight: 700;
            color: #1f2937;
            text-align: center;
        }

        .video-modal-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.75);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 9999;
            padding: 16px;
            box-sizing: border-box;
            backdrop-filter: blur(4px);
            -webkit-backdrop-filter: blur(4px);
        }

        .video-modal-overlay.open {
            display: flex;
        }

        .video-modal-card {
            position: relative;
            width: 100%;
            max-width: 800px;
            background: #ffffff;
            border-radius: 20px;
            padding: 16px;
            box-sizing: border-box;
            box-shadow: 0 20px 50px rgba(0,0,0,0.4);
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .video-modal-header {
            display: flex;
            justify-content: flex-end;
            align-items: center;
            width: 100%;
        }

        .video-modal-actions {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .video-modal-btn {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            background: #f1f5f9;
            color: #1e293b;
            border: none;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: background 0.2s ease;
            text-decoration: none;
        }

        .video-modal-btn:hover {
            background: #e2e8f0;
        }

        .video-modal-btn svg {
            width: 18px;
            height: 18px;
            stroke: currentColor;
        }

        .video-modal-btn.close-btn {
            font-size: 18px;
            font-weight: bold;
        }

        .video-player-wrapper {
            width: 100%;
            border-radius: 12px;
            overflow: hidden;
            background: #000000;
        }

        .video-player-wrapper video {
            width: 100%;
            height: auto;
            max-height: 75vh;
            display: block;
            border-radius: 12px;
        }

        .menu-btn { font-size: 22px; line-height: 1; width: 42px; height: 42px; border-radius: 50%; border: none; background: transparent; color: #111; cursor: pointer; display: flex; align-items: center; justify-content: center; }
        .menu-btn:hover { background: rgba(0, 0, 0, 0.05); }
        .menu-backdrop { position: fixed; inset: 0; background: rgba(0,0,0,0.24); opacity: 0; visibility: hidden; transition: opacity 0.28s ease; z-index: 1050; }
        .menu-backdrop.open { opacity: 1; visibility: visible; }
        .side-menu { position: fixed; top: 0; right: -100%; width: 60vw; max-width: 340px; height: 100vh; background: #fff; box-shadow: -18px 0 45px rgba(0,0,0,0.12); z-index: 1100; transition: right 0.28s ease; display: flex; flex-direction: column; padding: 32px 32px 28px; }
        .side-menu.open { right: 0; }
        .side-menu .menu-close-btn { margin-left: auto; border: none; background: transparent; font-size: 28px; line-height: 1; color: #333; cursor: pointer; }
        .side-menu .menu-title { margin: 0; font-size: 22px; letter-spacing: 0.18em; text-transform: uppercase; color: #888; font-weight: 700; }
        .side-menu .menu-list { margin-top: 48px; display: flex; flex-direction: column; gap: 28px; }
        .side-menu .menu-list button { border: none; background: transparent; text-align: left; color: #111; font-size: 14px; font-weight: 600; letter-spacing: 0.08em; padding: 0; cursor: pointer; }
        .side-menu .menu-list button + button { padding-top: 28px; border-top: 1px solid rgba(0,0,0,0.08); }
        .side-menu .menu-list button:hover { color: #0f4ad6; }
        @media (max-width: 500px) {
        .audio-list {
            grid-template-columns: 1fr; /* Single col on mobilephones*/
            gap: 12px;
        }
    }
    </style>
</head>
<body>
    <div class="app-container">
        <header class="dash-header">
            <div class="user-info">
                <div>
                    <h2 style="margin:0;">QIRA'AT</h2>
                </div>
            </div>
            <div class="header-actions">
                <button class="menu-btn" id="btn-menu" type="button" aria-label="Open menu">☰</button>
            </div>
        </header>
        <div id="qiraat-menu-backdrop" class="menu-backdrop"></div>
        <aside id="qiraat-side-menu" class="side-menu" aria-hidden="true">
            <button type="button" class="menu-close-btn" id="btn-menu-close">×</button>
            <p class="menu-title">UK QURAN</p>
            <div class="menu-list">
                <button type="button" id="btn-menu-home">HOME</button>
                <button type="button" id="btn-menu-thajweed">THAJWEED</button>
                <button type="button" id="btn-menu-qiraat">QIRA'AT</button>
                <button type="button" id="btn-menu-certificates">CERTIFICATES</button>
                <button type="button" id="btn-menu-logout">LOGOUT</button>
            </div>
        </aside>
      
        <div class="student-action-card" id="surah-card">
            <div class="fathiha">
                <h3 style="margin-left: 10px; margin-top: 20px;margin-bottom: 18px;">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"></path><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"></path></svg>
                    Qur'an 
                </h3>
                <p style="margin-left: 12px; margin-right: 22px; font-size: 14px;">
                    Surah al-fathiha
                </p>
            </div>
            <div class="video-list" id="surah-video-list"></div>
        </div>
        <div class="student-action-card" id="juz30-card">
            <div class="qiraat">
                <h3 style="margin-left: 10px; margin-top: 20px;margin-bottom: 18px;">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"></path><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"></path></svg>
                    Qur'an 
                </h3>
                <p style="margin-left: 12px; margin-right: 22px; font-size: 14px;">
                     JUZ 30
                </p>
                
            </div>

            
            <div class="audio-list" id="audio-list">
             <div class="audio-search" id="audio-search">
                <input style="width: 100%;margin-top: 10px; height: 30px;font-size: 0.80rem;" id="audio-search-input" type="search" placeholder="Search ......" aria-label="Search JUZ 30 audio">
            </div>
                <!-- Audio cards will be dynamically added here -->
            </div>
        </div>         
    </div>

    <div id="video-modal" class="video-modal-overlay">
        <div class="video-modal-card">
            <div class="video-modal-header">
                <div class="video-modal-actions">
                    <a id="video-modal-download" class="video-modal-btn" href="#" download title="Download Video">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v12"></path><path d="m7 10 5 5 5-5"></path><path d="M5 21h14"></path></svg>
                    </a>
                    <button id="video-modal-fullscreen" class="video-modal-btn" type="button" title="Fullscreen">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 3h6v6"></path><path d="m21 3-7 7"></path><path d="M9 21H3v-6"></path><path d="m3 21 7-7"></path></svg>
                    </button>
                    <button id="video-modal-close" class="video-modal-btn close-btn" type="button" title="Close">✕</button>
                </div>
            </div>
            <div class="video-player-wrapper" id="video-player-wrapper"></div>
        </div>
    </div>
    <script>
        const audioFolder = '../../audios/JUZ-30/';
        const audioFiles = [
            '100 - Adiyat.mp3',
            "101 - Qari'ah.mp3",
            '102 - Takathur.mp3',
            '103 - Asr.mp3',
            '104 - Humazah.mp3',
            '105 - Fil.mp3',
            '106 - Quraysh.mp3',
            '107 - Ma\'un.mp3',
            '108 - Kawthar.mp3',
            '109 - Kafirun.mp3',
            '110 - Nasr.mp3',
            '111 - Masad.mp3',
            '112 - Ikhlas.mp3',
            '113 - Falaq.mp3',
            '114 - Nas.mp3',
            '78 - Naba.mp3',
            '79 - Nazi\'at.mp3',
            '80 - Abasa.mp3',
            '81 - Takwir.mp3',
            '82 - Infitar.mp3',
            '83 - Mutaffifin.mp3',
            '84 - Inshiqaq.mp3',
            '85 - Buruj.mp3',
            '86 - Tariq.mp3',
            '87 - A\'la.mp3',
            '88 - Ghashiyah.mp3',
            '89 - Fajar.mp3',
            '90 - Balad.mp3',
            '91 - Shams.mp3',
            '92 - Layl.mp3',
            '93 - Duhaa.mp3',
            '94 - Sharh.mp3',
            '95 - Tin.mp3',
            '96 - Alaq.mp3',
            '97 - Qadar.mp3',
            '98 - Bayyinah.mp3',
            '99 - Zalzalah.mp3'
        ];

        function extractAudioNumber(name) {
            const match = name.match(/^(\d+)/);
            return match ? Number(match[1]) : Number.MAX_SAFE_INTEGER;
        }

        audioFiles.sort((a, b) => extractAudioNumber(a) - extractAudioNumber(b) || a.localeCompare(b, undefined, { sensitivity: 'base' }));

        const audioList = document.getElementById('audio-list');
        const searchInput = document.getElementById('audio-search-input');
        let currentAudio = null;
        let currentAudioData = null;

        function renderAudioCards(filter = '') {
            audioList.querySelectorAll('.audio-card, .no-results').forEach((node) => node.remove());

            const normalizedFilter = filter.trim().toLowerCase();
            const filteredFiles = audioFiles.filter((fileName) => {
                return fileName.toLowerCase().includes(normalizedFilter);
            });

            if (filteredFiles.length === 0) {
                const noResults = document.createElement('div');
                noResults.className = 'no-results';
                noResults.textContent = 'No audio files match your search.';
                noResults.style.color = '#666';
                noResults.style.padding = '12px 8px';
                audioList.appendChild(noResults);
                return;
            }

            filteredFiles.forEach((fileName) => {
                const card = document.createElement('div');
                card.className = 'audio-card';
                card.dataset.filename = fileName.toLowerCase();

                const row = document.createElement('div');
                row.className = 'audio-row';

                const playButton = document.createElement('button');
                playButton.className = 'audio-play-button';
                playButton.type = 'button';
                playButton.setAttribute('aria-label', `Play ${fileName.replace(/\.mp3$/i, '')}`);
                playButton.innerHTML = '<svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path d="M8 5v14l11-7z"/></svg>';

                const title = document.createElement('div');
                title.className = 'audio-title';
                title.textContent = fileName.replace(/\.mp3$/i, '');

                row.appendChild(playButton);
                row.appendChild(title);

                const audioContainer = document.createElement('div');
                audioContainer.className = 'audio-container';

                let audio = null;

                function createAudioElement() {
                    audio = document.createElement('audio');
                    audio.className = 'audio-controls';
                    audio.controls = true;
                    audio.preload = 'none';
                    audio.src = audioFolder + encodeURIComponent(fileName);

                    audio.addEventListener('play', () => {
                        if (currentAudioData && currentAudioData.audio !== audio) {
                            const { audio: previousAudio, button: previousButton, container: previousContainer } = currentAudioData;
                            previousAudio.pause();
                            if (previousContainer.contains(previousAudio)) {
                                previousContainer.removeChild(previousAudio);
                            }
                            previousButton.classList.remove('hidden');
                            currentAudioData = null;
                        }
                        currentAudio = audio;
                        currentAudioData = { audio, button: playButton, container: audioContainer };
                        playButton.classList.add('hidden');
                    });

                    audio.addEventListener('pause', () => {
                        if (currentAudio === audio) {
                            currentAudio = null;
                        }
                    });

                    audio.addEventListener('ended', () => {
                        if (currentAudio === audio) {
                            currentAudio = null;
                        }
                        if (currentAudioData && currentAudioData.audio === audio) {
                            currentAudioData = null;
                        }
                    });
                }

                playButton.addEventListener('click', () => {
                    if (currentAudioData && currentAudioData.audio !== audio) {
                        const { audio: previousAudio, button: previousButton, container: previousContainer } = currentAudioData;
                        previousAudio.pause();
                        if (previousContainer.contains(previousAudio)) {
                            previousContainer.removeChild(previousAudio);
                        }
                        previousButton.classList.remove('hidden');
                        currentAudioData = null;
                        currentAudio = null;
                    }
                    if (!audio) {
                        createAudioElement();
                    }
                    if (!audioContainer.contains(audio)) {
                        audioContainer.appendChild(audio);
                    }
                    if (audio.paused) {
                        audio.play();
                    } else {
                        audio.pause();
                    }
                });

                card.appendChild(row);
                card.appendChild(audioContainer);
                audioList.appendChild(card);
            });
        }

        renderAudioCards();

        searchInput.addEventListener('input', (event) => {
            renderAudioCards(event.target.value);
        });

        const card = document.getElementById('juz30-card');
        card.addEventListener('click', (event) => {
            const ignoreClick = event.target.closest('.audio-list, .audio-search, input, audio, button');
            if (ignoreClick) return;
            card.classList.toggle('open');
        });
        const btnBack = document.getElementById('btn-back');
        if (btnBack) {
            btnBack.addEventListener('click', () => {
                window.location.href = '../Student/student.html';
            });
        }

        const surahVideoFiles = [
            {
                fileName: 'Surah al-fathiha.mp4',
                title: 'Surah al-Fatiha',
                thumb: '../../images/quran/Surah al-fathiha.webp'
            }
        ];

        const surahCard = document.getElementById('surah-card');
        const surahVideoList = document.getElementById('surah-video-list');
        const surahHeader = surahCard?.querySelector('h3');

        surahHeader?.addEventListener('click', () => {
            surahCard.classList.toggle('open');
        });
        const surahVideoModal = document.getElementById('video-modal');
        const surahVideoWrapper = document.getElementById('video-player-wrapper');
        const surahVideoDownload = document.getElementById('video-modal-download');
        const surahVideoFullscreen = document.getElementById('video-modal-fullscreen');
        const surahVideoClose = document.getElementById('video-modal-close');

        function getSurahVideoUrl(fileName) {
            return '../../videos/Surah al-fathiha/' + encodeURIComponent(fileName);
        }

        function openSurahModal(fileName) {
            surahVideoWrapper.innerHTML = '';

            const video = document.createElement('video');
            video.controls = true;
            video.autoplay = true;
            video.playsInline = true;
            video.src = getSurahVideoUrl(fileName);
            surahVideoWrapper.appendChild(video);

            if (surahVideoDownload) {
                surahVideoDownload.href = getSurahVideoUrl(fileName);
                surahVideoDownload.download = fileName;
            }

            surahVideoModal.classList.add('open');
            document.body.classList.add('modal-open');
        }

        function closeSurahModal() {
            const video = surahVideoWrapper.querySelector('video');
            if (video) {
                try { video.pause(); } catch (e) {}
                surahVideoWrapper.innerHTML = '';
            }
            surahVideoModal.classList.remove('open');
            document.body.classList.remove('modal-open');
        }

        surahVideoFiles.forEach((item) => {
            const card = document.createElement('div');
            card.className = 'video-card';

            const row = document.createElement('div');
            row.className = 'video-card-row';

            const thumbWrap = document.createElement('div');
            thumbWrap.className = 'thumb-wrap';

            const thumb = document.createElement('img');
            thumb.className = 'video-thumb';
            thumb.src = item.thumb;
            thumb.alt = item.title;
            thumb.onerror = () => {
                thumb.onerror = null;
                thumb.src = '../../images/arabic-letters/PART- 2.webp';
            };

            const playButton = document.createElement('button');
            playButton.className = 'play-overlay';
            playButton.type = 'button';
            playButton.setAttribute('aria-label', 'Play video');
            playButton.innerHTML = '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 5.5v13l10.5-6.5L8 5.5z"/></svg>';

            thumbWrap.appendChild(thumb);
            thumbWrap.appendChild(playButton);

            const title = document.createElement('div');
            title.className = 'video-title';
            title.textContent = item.title;

            playButton.addEventListener('click', (e) => {
                e.stopPropagation();
                openSurahModal(item.fileName);
            });

            card.addEventListener('click', () => openSurahModal(item.fileName));

            row.appendChild(thumbWrap);
            row.appendChild(title);
            card.appendChild(row);
            surahVideoList.appendChild(card);
        });

        surahVideoClose?.addEventListener('click', closeSurahModal);
        surahVideoModal?.addEventListener('click', (e) => {
            if (e.target === surahVideoModal) closeSurahModal();
        });

        surahVideoFullscreen?.addEventListener('click', () => {
            const video = surahVideoWrapper.querySelector('video');
            if (!video) return;
            if (video.requestFullscreen) {
                video.requestFullscreen();
            } else if (video.webkitRequestFullscreen) {
                video.webkitRequestFullscreen();
            }
        });

        // --- DYNAMIC GUEST MENU CHECK ---
const isGuest = sessionStorage.getItem('isGuest') === 'true';
const btnMenuCertificates = document.getElementById('btn-menu-certificates');
const btnMenuLogout = document.getElementById('btn-menu-logout');

// Hide student-only menu items if user is a Guest
if (isGuest) {
    if (btnMenuCertificates) btnMenuCertificates.style.display = 'none';
    if (btnMenuLogout) btnMenuLogout.textContent = 'EXIT GUEST MODE';
}

const btnMenu = document.getElementById('btn-menu');
const qiraatMenuBackdrop = document.getElementById('qiraat-menu-backdrop');
const qiraatSideMenu = document.getElementById('qiraat-side-menu');
const btnMenuClose = document.getElementById('btn-menu-close');
const btnMenuHome = document.getElementById('btn-menu-home');
const btnMenuThajweed = document.getElementById('btn-menu-thajweed');
const btnMenuQiraat = document.getElementById('btn-menu-qiraat');

const openMenu = () => {
    qiraatSideMenu.classList.add('open');
    qiraatMenuBackdrop.classList.add('open');
    qiraatSideMenu.setAttribute('aria-hidden', 'false');
};

const closeMenu = () => {
    qiraatSideMenu.classList.remove('open');
    qiraatMenuBackdrop.classList.remove('open');
    qiraatSideMenu.setAttribute('aria-hidden', 'true');
};

btnMenu?.addEventListener('click', (event) => {
    event.stopPropagation();
    openMenu();
});
btnMenuClose?.addEventListener('click', closeMenu);
qiraatMenuBackdrop?.addEventListener('click', closeMenu);

// Route HOME based on user role (Guest vs Student)
btnMenuHome?.addEventListener('click', () => {
    closeMenu();
    if (isGuest) {
        window.location.href = '../Guest/guest.html';
    } else {
        window.location.href = '../Student/student.html';
    }
});

btnMenuThajweed?.addEventListener('click', () => {
    closeMenu();
    window.location.href = '../Thajweed/thajweed.html';
});

btnMenuQiraat?.addEventListener('click', () => {
    closeMenu();
    window.location.href = 'qiraat.html';
});

btnMenuCertificates?.addEventListener('click', () => {
    closeMenu();
    window.location.href = '../Certificates/certificates.html';
});

btnMenuLogout?.addEventListener('click', () => {
    closeMenu();
    if (isGuest) {
        sessionStorage.removeItem('isGuest');
    }
    window.location.href = '../../index.html';
});
    </script>
</body>
</html>
